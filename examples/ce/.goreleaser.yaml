# PocketOne's release config (the repo root's .goreleaser.yaml is upstream's, for plain examples/base).
# Run from the repo root:
#
#   goreleaser release --config examples/ce/.goreleaser.yaml --release-notes <file>
#
version: 2

project_name: pocketbase

dist: .builds

before:
  hooks:
    - go mod tidy
    - go -C examples/ce mod tidy

builds:
  - id: build_noncgo
    # the standard CE binary: examples/base + the default CE plugins, in its own module
    dir: examples/ce
    main: .
    binary: pocketbase
    ldflags:
      - -s -w -X ganigeorgiev.com/pocketbase/pocketbase.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
      - s390x
      - ppc64le
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: ppc64le
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: ppc64le

release:
  draft: true
  name_template: 'PocketOne {{ .Tag }}'
  # every release's notes start with the install lines
  header: |
    ## Install

    ```bash
    brew install pockethost/tap/pocketbase
    ```

    Homebrew on macOS or Linux; the formula comes from [pockethost/homebrew-tap](https://github.com/pockethost/homebrew-tap). Or download the zip for your platform below and run `./pocketbase serve`.

# the Homebrew formula in pockethost/homebrew-tap, updated on every release. brews is deprecated in favor of
# homebrew_casks, but casks are macOS-only and quarantine unsigned binaries; the formula works on macOS and Linux.
brews:
  - name: pocketbase
    ids: [archive_noncgo]
    repository:
      owner: pockethost
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/pockethost/pocketone
    description: PocketOne, a community fork of PocketBase with plugins (pages, pocker and more)
    license: MIT
    commit_author:
      name: PocketHost
      email: noreply@pockethost.io
    install: |
      bin.install "pocketbase"
    test: |
      system "#{bin}/pocketbase", "--version"

archives:
  - id: archive_noncgo
    ids: [build_noncgo]
    formats: [zip]
    files:
      - LICENSE.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

# GitHub renders every newline in release notes as a line break: never hard-wrap the header above or the notes file.
# Release notes are written by hand: always run `goreleaser release --config examples/ce/.goreleaser.yaml --release-notes <file>` (that skips the
# generated changelog, which would list PocketBase's whole upstream history). Don't set changelog.disable: it drops
# the --release-notes file too. The header above is prepended to the notes.
