# Every commit that changes PocketBase core (anything outside ext/, examples/ce/, docs/, README.md, AGENTS.md, CLAUDE.md,
# .github/, .claude/) must carry a "Core-Audit:" trailer recording its independent audit. See AGENTS.md.
name: core-audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trailer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Core commits carry a Core-Audit trailer
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "no previous commit to compare with; skipping"; exit 0
          fi
          missing=0
          for c in $(git rev-list --no-merges "$BEFORE..$AFTER"); do
            core=$(.github/core-audit/core-diff.sh --files "$c^" "$c" || true)
            [ -z "$core" ] && continue
            trailer=$(git log -1 --format='%(trailers:key=Core-Audit,valueonly)' "$c" | sed '/^$/d')
            if [ -z "$trailer" ]; then
              echo "::error::$(git log -1 --format='%h %s' "$c") changes core without a Core-Audit trailer:"
              echo "$core" | sed 's/^/  /'
              missing=1
            else
              echo "ok $(git log -1 --format='%h' "$c"): Core-Audit: $trailer"
            fi
          done
          exit $missing
